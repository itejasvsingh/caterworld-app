function p(){return s.profiles[s.role]}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}function go(page){s.page=page;render();$('#screen').scrollTop=0}function choose(r){s.role=r;go(p().onboarded?'home':'contact')}function resetDemo(){if(confirm('Restart all sample journeys and clear demo data?'))location.reload()}function btn(label,action,cls='primary'){return `<button type="button" class="${cls}" onclick="${action}">${label}</button>`}function head(k,t,sub=''){return `<p class="eyebrow">${k}</p><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}function field(label,key,val,obj='draft',type='text',attrs=''){return `<label class="field" for="${key}">${label}</label><input id="${key}" type="${type}" value="${esc(val)}" ${attrs} oninput="update('${obj}','${key}',this.value)">`}function select(label,key,val,opts,obj='draft'){return `<label class="field" for="${key}">${label}</label><select id="${key}" onchange="update('${obj}','${key}',this.value);render()">${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(val)?'selected':''}>${esc(o||'Select an option')}</option>`).join('')}</select>`}function update(obj,k,v){const numeric=['veg','nonveg','budget','cycle','capacity','price'];(obj==='profile'?p():obj==='quote'?s.quotesDraft:s.draft)[k]=numeric.includes(k)?+v:v;if(obj==='draft'&&k==='diet'){if(v==='Vegetarian'){s.draft.veg=pax(s.draft);s.draft.nonveg=0}else if(v==='Non-vegetarian'){s.draft.nonveg=pax(s.draft);s.draft.veg=0}}if(k==='start'){s.month=v.slice(0,7)}if(['start','end'].includes(k)){s.draft.holidays=Object.fromEntries(Object.entries(s.draft.holidays).filter(([d])=>d>=s.draft.start&&d<=s.draft.end));render()}if(obj==='quote'&&$('#quoteSubtotal'))$('#quoteSubtotal').textContent=money(totals(order(),s.quotesDraft).subtotal);if(['veg','nonveg'].includes(k)&&$('#pax'))$('#pax').textContent='Total: '+pax(s.draft)+' pax'}
function dateObj(d){return new Date(d+'T12:00:00')}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function range(r){if(!r.start)return [];let start=dateObj(r.start),end=dateObj(r.type==='One-time event'?r.start:r.end),out=[];for(let d=start;d<=end&&out.length<732;d.setDate(d.getDate()+1))out.push(iso(d));return out}function activeDates(r){return range(r).filter(d=>r.type==='One-time event'||(r.weekdays.includes(dateObj(d).getDay())&&!Object.hasOwn(r.holidays,d)))}function pax(r){return +r.veg + +r.nonveg}function fullAddress(r){return [r.address,r.area,r.city,r.state,r.pincode].filter(Boolean).join(', ')}function pretty(d){return dateObj(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}function order(){return s.orders.find(o=>o.id===s.orderId)}function openOrder(id,page){s.orderId=id;let o=order();s.month=o.req.start.slice(0,7);go(page|| (s.role==='caterer'?(o.confirmed?'tracking':'quote'):(o.confirmed?'tracking':'compare')))}
function splash(){return `<div class="splash"><div class="wordmark">caterworld<span>.</span></div><p class="sub">Catering made simple</p><div class="splashline"></div>${btn('Open app',"go('roles')")}</div>`}
function roles(){return head('WELCOME TO CATERWORLD','How will you use<br>Caterworld?','Choose an account to get started.')+[['business','B','Business','Meals for your office or organization'],['individual','I','Individual','Catering for your personal occasions'],['caterer','C','Caterer','Manage your catering business']].map(([r,i,t,d])=>`<button class="rolecard" onclick="choose('${r}')"><span class="roleicon">${i}</span><span><b>${t}</b><small>${d}</small></span><span class="arrow">›</span></button>`).join('')+'<p class="muted">Your account type determines the onboarding details we need.</p>'}
function contact(){let business=s.role!=='individual';return head('ONBOARDING · '+labels[s.role].toUpperCase(),'Let’s get acquainted.','Start with your basic details.')+`<div class="steps"><i class="done"></i>${business?'<i></i><i></i>':''}</div><form onsubmit="event.preventDefault();contactNext()">${field('Full name *','name',p().name,'profile','text','required autocomplete="name"')}${business?field(s.role==='business'?'Business / organization name *':'Catering business name *','company',p().company,'profile','text','required'):''}${field('Mobile number *','mobile',p().mobile,'profile','tel','required pattern="[0-9]{10}" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number"')}<div class="notice">Prototype: continue simulates mobile verification. No OTP is sent.</div><button class="primary">Verify mobile & continue</button></form>`}
function contactNext(){if(s.role==='individual'){p().onboarded=true;p().status='verified';go('home')}else go('documents')}
function upload(key,title){let file=p().docs[key];return `<div class="upload"><label class="field" for="file-${key}">${title} *</label><input id="file-${key}" type="file" accept=".pdf,.png,.jpg,.jpeg" onchange="attach('${key}',this)"><p id="filelabel-${key}">${file?esc(file):'PDF, JPG or PNG · Up to 5 MB'}</p>${btn('Use sample document',`sampleDoc('${key}')`,'link')}</div>`}
function attach(k,input){let f=input.files[0];if(!f)return;if(f.size>5*1024*1024||!(/\.(pdf|png|jpe?g)$/i.test(f.name))){input.value='';toast('Choose a PDF or image under 5 MB');return}p().docs[k]=f.name;$('#filelabel-'+k).textContent=f.name+' · Selected locally (demo)'}function sampleDoc(k){p().docs[k]='Sample '+k+' document.pdf';$('#filelabel-'+k).textContent=p().docs[k]+' · Demo attachment'}
function capabilityFields(){return `<h3 style="margin-top:24px">Catering capabilities</h3>${select('Cuisine *','cuisine',p().cuisine,['','North Indian','South Indian','Both'],'profile')}<label class="field">Where can you cook? * (select all that apply)</label>${['Cook at own facility','Cook at site'].map(v=>`<label class="choice"><input type="checkbox" ${p().cooking.includes(v)?'checked':''} onchange="toggleCooking('${v}',this.checked)"> ${v}</label>`).join('')}${select('Can you provide serving staff? *','serving',p().serving,['','Yes','No'],'profile')}<p class="muted">Serving means staff to serve food to guests.</p>`}
function toggleCooking(value,checked){p().cooking=checked?[...new Set([...p().cooking,value])]:p().cooking.filter(v=>v!==value)}
function documents(){return head('ONBOARDING · VERIFICATION','Verify your business.','Caterworld reviews the submitted details and documents.')+`<div class="steps"><i class="done"></i><i class="done"></i><i></i></div><p class="muted">Use sample details and documents for this prototype. Files stay on your device and are not uploaded.</p><form onsubmit="event.preventDefault();documentsNext()">${field('GSTIN *','gst',p().gst,'profile','text','required pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]" maxlength="15" placeholder="15-character GSTIN" style="text-transform:uppercase"')}${upload('gst','GST certificate')}${s.role==='caterer'?field('FSSAI license number *','fssai',p().fssai,'profile','text','required pattern="[0-9]{14}" maxlength="14" inputmode="numeric" placeholder="14-digit license number"')+upload('fssai','FSSAI license')+field('Service city *','city',p().city,'profile','text','required')+field('Daily capacity (pax) *','capacity',p().capacity,'profile','number','required min="1" step="1"')+capabilityFields():''}<button class="primary">${s.role==='caterer'?'Continue to bank details':'Submit for Caterworld review'}</button></form>${btn('Fill sample verification details',"p().gst='33ABCDE1234F1Z5';p().fssai='12345678901234';render()",'link')}`}
function documentsNext(){if(s.role==='caterer'&&(!p().cuisine||!p().cooking.length||!p().serving))return toast('Choose your cuisine, cooking capabilities and serving availability');if(!p().docs.gst||(s.role==='caterer'&&!p().docs.fssai))return toast('Attach all required verification documents');if(s.role==='caterer')go('bank');else submitReview()}
function bank(){return head('ONBOARDING · PAYOUT DETAILS','Add your bank details.','Required for Caterworld verification.')+`<div class="steps"><i class="done"></i><i class="done"></i><i class="done"></i></div><form onsubmit="event.preventDefault();if(!p().docs.bank)return toast('Attach bank proof');submitReview()">${field('Account holder name *','holder',p().holder,'profile','text','required')}${field('Bank name *','bank',p().bank,'profile','text','required')}${field('Account number *','account',p().account,'profile','text','required pattern="[0-9]{9,18}" inputmode="numeric"')}${field('IFSC *','ifsc',p().ifsc,'profile','text','required pattern="[A-Z]{4}0[A-Z0-9]{6}" maxlength="11"')}${upload('bank','Cancelled cheque / bank account proof')}<p class="muted">Demo only. Use sample bank details, not a real account.</p><button class="primary">Submit for Caterworld review</button></form>${btn('Fill sample bank details',"p().holder='Sample Caterer';p().bank='Sample Bank';p().account='000000000000';p().ifsc='DEMO0000000';render()",'link')}`}
function submitReview(){p().status='pending';go('review')}
function review(){return head('CATERWORLD VERIFICATION','Submitted for review.','Your onboarding details are ready for Caterworld to check.')+`<span class="pill">Pending verification</span><ul class="checklist"><li>Business details submitted</li><li>GST certificate attached</li>${s.role==='caterer'?'<li>FSSAI license attached</li><li>Bank details & proof attached</li>':''}</ul><p class="sub">Your dashboard becomes available after Caterworld approves your account.</p><div class="notice">Prototype control: the action below simulates Caterworld approval. It does not perform real document verification.</div>${btn('Simulate Caterworld approval',"p().status='verified';p().onboarded=true;go('home')")}${btn('Edit submitted details',"go('documents')",'secondary')}`}
function visibleOrders(){return s.orders.filter(o=>s.role==='caterer'||o.owner===s.role)}
function home(){let list=visibleOrders(),active=list.filter(o=>o.confirmed&&!allComplete(o));return head(labels[s.role].toUpperCase()+' ACCOUNT','Hello, '+esc(p().name.split(' ')[0]||'there')+'.',s.role==='caterer'?'Your catering business, in one place.':'What are you planning today?')+`<div class="row"><div class="stat"><b>${active.length}</b><span>Active orders</span></div><div class="stat"><b>${list.filter(o=>!o.confirmed).length}</b><span>${s.role==='caterer'?'Quote requests':'Open requests'}</span></div></div><div class="actions">${s.role==='caterer'?btn('Quotations <small>Respond to requests</small>',"go('orders')",''):btn('＋ Create order <small>Plan your catering</small>',"newRequest()",'')}${btn('Manage orders <small>View status & schedules</small>',"go('orders')",'')}</div><div class="sectiontitle"><h3>Recent activity</h3></div>${list.length?list.slice(-2).reverse().map(orderCard).join(''):`<div class="card"><h3>${s.role==='caterer'?'Ready for your first order':'Your next meal starts here'}</h3><p>${s.role==='caterer'?'New quotation requests will appear here after a client creates an order.':'Create a catering request to find a suitable partner.'}</p></div>`}<div class="notice">${s.role==='individual'?'Mobile verified':'Verified by Caterworld'} · Demo account</div>`}
function orderCard(o){return `<button class="card" style="width:100%;text-align:left" onclick="openOrder('${o.id}')"><span class="pill">${o.confirmed?(allComplete(o)?'Completed':'Confirmed'):'Quotation stage'}</span><h3 style="margin-top:12px">${esc(o.req.title)}</h3><p>${o.id} · ${pax(o.req)} pax · ${pretty(o.req.start)}</p><p>${activeDates(o.req).length} service day(s) · ${esc(o.req.city)}</p><p>${esc(o.req.fulfilment)} · Serving staff: ${esc(o.req.serving)}</p><b style="font-size:14px">Open ${s.role==='caterer'&&!o.confirmed?'quotation':'order'} ›</b></button>`}
function orders(){return head('YOUR WORKSPACE',s.role==='caterer'?'Manage orders':'Orders & requests')+(visibleOrders().length?visibleOrders().slice().reverse().map(orderCard).join(''):'<div class="card"><h3>No orders yet</h3><p>Your orders and quotation requests will appear here.</p></div>')+(s.role==='caterer'?'':btn('Create order','newRequest()'))}
function profile(){return head('ACCOUNT',labels[s.role]+' profile')+`<div class="card"><h3>${esc(p().company||p().name)}</h3><p>${esc(p().name)}</p><p>${esc(p().mobile)}</p><span class="pill">${p().status==='verified'?'Verified · demo':p().status}</span></div><p class="sub">${s.role==='caterer'?'GST, FSSAI and bank proof are part of your Caterworld verification.':s.role==='business'?'Your business GST verification is complete.':'Individual accounts do not require business GST verification.'}</p>${s.role==='caterer'?`<div class="card"><h3>Catering capabilities</h3><p>Cuisine: ${esc(p().cuisine)}</p><p>${p().cooking.map(esc).join(' · ')}</p><p>Serving staff: ${esc(p().serving)}</p></div>`:''}${btn('Switch account type',"go('roles')",'secondary')}${btn('View onboarding again',"go('contact')",'secondary')}<p class="muted">Switching accounts preserves this session’s sample orders. Reloading clears the prototype data.</p>`}
function newRequest(){s.draft=makeRequest();if(s.role==='individual'){s.draft.type='One-time event';s.draft.title='Family celebration';s.draft.veg=40;s.draft.nonveg=10}s.month=s.draft.start.slice(0,7);go('request')}
function request(){let r=s.draft;return head('CREATE ORDER · 1 OF 3','Tell us what you need.','Add the full address so your caterer knows exactly where to serve.')+`<form onsubmit="event.preventDefault();if(pax(s.draft)<1)return toast('Add at least one guest');if(!s.draft.fulfilment||!s.draft.serving)return toast('Choose a cooking option and whether serving staff are needed');go('schedule')">${field('Order name *','title',r.title,'draft','text','required')}${select('Order type','type',r.type,['Recurring meals','One-time event'])}${field('Building / office, floor & street address *','address',r.address,'draft','text','required placeholder="Tower A, 3rd floor, 12 OMR Road"')}${field('Area / locality *','area',r.area,'draft','text','required placeholder="Perungudi"')}<div class="row">${field('City *','city',r.city,'draft','text','required')}${field('Pincode *','pincode',r.pincode,'draft','text','required pattern="[1-9][0-9]{5}" maxlength="6" inputmode="numeric"')}</div>${field('State *','state',r.state,'draft','text','required')}${select('Cooking requirement *','fulfilment',r.fulfilment,['','Cook and deliver','Cook at site'])}${select('Do you need serving staff? *','serving',r.serving,['','Yes','No'])}<p class="muted">Serving means staff to serve food to your guests.</p>${select('Meal session','meal',r.meal,['Breakfast','Lunch','Dinner'])}${field('Service time *','time',r.time,'draft','time','required')}${select('Food preference *','diet',r.diet,['Vegetarian','Non-vegetarian','Both'])}<div class="row">${r.diet!=='Non-vegetarian'?field('Veg pax *','veg',r.veg,'draft','number','required min="1" step="1"'):''}${r.diet!=='Vegetarian'?field('Non-veg pax *','nonveg',r.nonveg,'draft','number','required min="1" step="1"'):''}</div><p class="sub" id="pax">Total: ${pax(r)} pax</p>${field('Budget per plate, before tax (₹) *','budget',r.budget,'draft','number','required min="1"')}<button class="primary">Continue to service calendar</button></form>`}
function changeMonth(n){let d=dateObj(s.month+'-01');d.setMonth(d.getMonth()+n);s.month=iso(d).slice(0,7);render()}
function toggleDay(d){if(Object.hasOwn(s.draft.holidays,d))delete s.draft.holidays[d];else s.draft.holidays[d]='Office holiday';render()}
function weekday(n){let r=s.draft;r.weekdays=r.weekdays.includes(n)?r.weekdays.filter(x=>x!==n):[...r.weekdays,n];render()}
function calendar(r,editable=false){let m=dateObj(s.month+'-01'),start=m.getDay(),max=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),dates=range(r),active=activeDates(r);return `<div class="calendar"><div class="calhead">${btn('‹','changeMonth(-1)','')}<b>${m.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b>${btn('›','changeMonth(1)','')}</div><div class="grid7">${['S','M','T','W','T','F','S'].map(x=>`<span class="dow">${x}</span>`).join('')}${Array(start).fill('<span></span>').join('')}${Array.from({length:max},(_,i)=>{let d=s.month+'-'+String(i+1).padStart(2,'0'),inRange=dates.includes(d),holiday=Object.hasOwn(r.holidays,d),served=active.includes(d);return `<button type="button" aria-label="${d}: ${holiday?'Holiday':served?'Service day':'No service'}" ${!editable||!inRange?'disabled':''} class="day ${!inRange?'out':holiday?'holiday':served?'service':''}" onclick="toggleDay('${d}')">${i+1}</button>`}).join('')}</div><div class="legend"><span><i></i>Service</span><span><i class="off"></i>Holiday</span><span><i class="closed"></i>No service</span></div></div>`}
function holidayList(r,edit=false){let entries=Object.entries(r.holidays).filter(([d])=>range(r).includes(d)).sort();return entries.length?`<h3>Office holidays</h3>${entries.map(([d,name])=>edit?`<div class="holidayrow"><span>${pretty(d)}</span><input aria-label="Holiday name for ${d}" value="${esc(name)}" oninput="s.draft.holidays['${d}']=this.value"><button type="button" aria-label="Remove holiday ${d}" onclick="toggleDay('${d}')">×</button></div>`:`<div class="line"><span>${pretty(d)}</span><b>${esc(name||'Office holiday')}</b></div>`).join('')}`:'<p class="muted">No office holidays marked.</p>'}
function schedule(){let r=s.draft;return head('CREATE ORDER · 2 OF 3','Set your service days.',r.type==='Recurring meals'?'Choose working days, then tap dates to mark office holidays.':'Choose the date for your event.')+`<form onsubmit="event.preventDefault();scheduleNext()">${field(r.type==='Recurring meals'?'Start date *':'Event date *','start',r.start,'draft','date','required')}${r.type==='Recurring meals'?field('End date *','end',r.end,'draft','date','required min="'+r.start+'"')+`<label class="field">Office working days</label><div class="weekday">${['S','M','T','W','T','F','S'].map((x,n)=>`<button type="button" aria-label="${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n]}" aria-pressed="${r.weekdays.includes(n)}" class="${r.weekdays.includes(n)?'selected':''}" onclick="weekday(${n})">${x}</button>`).join('')}</div>${calendar(r,true)}${holidayList(r,true)}<div class="notice"><b>${activeDates(r).length} service days</b> · Office holidays and non-working days are excluded from the quotation.</div>${select('Repeating menu cycle (days)','cycle',r.cycle,[7,14])}`:''}<button class="primary">Continue to caterers</button></form>`}
function scheduleNext(){let r=s.draft;if(r.type==='Recurring meals'&&(r.end<r.start||range(r).length>366))return toast('Choose a valid date range of up to one year');if(!activeDates(r).length)return toast('Select at least one service day');go('suppliers')}
function suppliers(){let r=s.draft,eligible=r.city.toLowerCase().includes('chennai')&&pax(r)<=300;return head('CREATE ORDER · 3 OF 3','Choose your caterers.','Send the same request without re-entering your details.')+`<div class="card"><h3>${esc(r.title)}</h3><p>${pax(r)} pax · ${activeDates(r).length} service day(s)</p><p>${esc(fullAddress(r))}</p><p>${esc(r.fulfilment)} · Serving staff: ${esc(r.serving)}</p></div>${eligible?[['Sample Kitchen A',150],['Sample Kitchen B',300]].filter(v=>v[1]>=pax(r)).map(([name,cap])=>`<label class="card choice"><input type="checkbox" name="supplier" value="${name}"><span><b>${name}</b><br><span class="sub">Verified · Chennai · Up to ${cap} pax<br>North & South Indian<br>Cook and deliver · Cook at site<br>Serving staff available</span></span></label>`).join(''):'<div class="notice">No sample caterers match. This prototype has Chennai suppliers with capacity up to 300 pax.</div>'}${btn('Request quotations','sendRFQ()')}${btn('Edit requirement',"go('request')",'secondary')}<p class="muted">Sample businesses only. No requests are sent outside this prototype.</p>`}
function sampleMenu(n,diet='Both'){return Array.from({length:n},(_,i)=>['Phulka, veg pulao, dal, paneer curry, raita; chicken curry for non-veg','Chapati, rice, sambar, poriyal, curd; egg curry for non-veg','Jeera rice, rajma, aloo gobi, roti, salad; chicken masala for non-veg'][i%3]).map(m=>diet==='Vegetarian'?m.split(';')[0]:m)}
function sendRFQ(){let selected=[...document.querySelectorAll('[name=supplier]:checked')].map(x=>x.value);if(!selected.length)return toast('Select at least one caterer');let r=clone(s.draft),o={id:'CW-'+String(s.orders.length+1).padStart(3,'0'),owner:s.role,req:r,invited:selected,quotes:selected.map((name,i)=>({name,price:name.endsWith('A')?195:210,menus:Array(r.type==='One-time event'?1:+r.cycle).fill(''),submitted:false})),chosen:0,confirmed:false,serviceStatus:{},feedback:{}};s.orders.push(o);s.orderId=o.id;go('compare');toast('Sample quotation request created')}
function totals(o,q){let subtotal=pax(o.req)*activeDates(o.req).length*q.price;return {subtotal,tax:subtotal*.05,total:subtotal*1.05}}
function summary(o,withCalendar=false){let r=o.req;return `<div class="card"><h3>${esc(r.title)}</h3><p>${esc(r.meal)} · ${esc(r.time)} · ${pax(r)} pax</p><p>Food preference: ${esc(r.diet)}</p><p>${r.veg} veg / ${r.nonveg} non-veg</p><p>Budget: ${money(r.budget)} / plate, before tax</p><p>${esc(fullAddress(r))}</p><p>${esc(r.fulfilment)} · Serving staff: ${esc(r.serving)}</p><p>${pretty(r.start)}${r.type==='Recurring meals'?' – '+pretty(r.end):''} · ${activeDates(r).length} service day(s)</p>${r.type==='Recurring meals'?`<p>Repeating menu: ${r.cycle} days</p>`:''}</div>${withCalendar&&r.type==='Recurring meals'?calendar(r)+holidayList(r):''}`}
function menuReview(q){return `<div class="menuplan"><h3>Proposed menu · ${q.menus.length} day(s)</h3>${q.menus.map((m,i)=>`<details><summary>Day ${i+1}</summary><p>${esc(m).replace(/\n/g,'<br>')}</p></details>`).join('')}</div>`}
function loadSampleQuotes(){let o=order();o.quotes.forEach(q=>{if(!q.submitted){q.menus=sampleMenu(o.req.type==='One-time event'?1:+o.req.cycle,o.req.diet);q.submitted=true;q.sample=true}});render();toast('Sample menus and quotations loaded')}
function askRevision(i){let q=order().quotes[i],note=document.getElementById('revision-'+i).value.trim();if(!note)return toast('Tell the caterer what to change');q.revision=note;q.submitted=false;s.quotesDraft=null;render();toast('Menu revision requested')}
function compare(){let o=order();if(!o)return orders();return head(o.id,'Menus & quotations.','Review every menu day and the price before choosing a caterer.')+summary(o)+o.quotes.map((q,i)=>{let t=totals(o,q);return `<div class="card"><span class="pill">${q.submitted?(q.sample?'Sample proposal':'Proposal received'):q.revision?'Revision requested':'Awaiting proposal'}</span><h3 style="margin-top:12px">${esc(q.name)}</h3>${q.submitted?`<div class="line"><span>Your budget / plate</span><b>${money(o.req.budget)}</b></div><div class="line"><span>Quoted / plate, before tax</span><b>${money(q.price)}</b></div><p>${q.price>o.req.budget?'Above budget by '+money(q.price-o.req.budget)+' / plate':'Within your per-plate budget'}</p>${menuReview(q)}<div class="line"><span>Meals subtotal</span><b>${money(t.subtotal)}</b></div><div class="line"><span>Illustrative tax · 5%</span><b>${money(t.tax)}</b></div><div class="line"><b>Order total</b><b>${money(t.total)}</b></div>${btn('Select this menu & quotation',`order().chosen=${i};go('confirm')`)}<details><summary>Request menu or price changes</summary><label class="field" for="revision-${i}">What would you like changed?</label><textarea id="revision-${i}" placeholder="E.g. change Day 2 curry or reduce the price"></textarea>${btn('Send revision request',`askRevision(${i})`,'secondary')}</details>`:`<p>${esc(q.revision||'The caterer will propose a menu and price based on your budget.')}</p>`}</div>`}).join('')+(!o.quotes.some(q=>q.submitted)?`<div class="notice">For the demo, switch to Caterer to prepare a quotation, or load sample proposals below.</div>${btn('Load sample menu proposals','loadSampleQuotes()','secondary')}`:'')}
function confirmOrder(){let o=order(),r=o.req,q=o.quotes[o.chosen];return head(o.id,'Confirm your order.')+summary(o,true)+menuReview(q)+`<div class="card"><h3>${q.name}</h3><div class="line"><span>Full order total</span><b>${money(totals(o,q).total)}</b></div></div><form onsubmit="event.preventDefault();finalizeOrder()"><h3>Billing address</h3><label class="choice"><input type="checkbox" ${r.sameBilling?'checked':''} onchange="order().req.sameBilling=this.checked;render()"> Same as service location</label>${r.sameBilling?`<p class="sub">${esc(fullAddress(r))}</p><p>${esc(r.fulfilment)} · Serving staff: ${esc(r.serving)}</p>`:`<label class="field" for="billing">Billing address (optional)</label><textarea id="billing" oninput="order().req.billing=this.value">${esc(r.billing)}</textarea><label class="field" for="billingPin">Billing pincode (optional)</label><input id="billingPin" inputmode="numeric" maxlength="6" pattern="[1-9][0-9]{5}" value="${esc(r.billingPin)}" oninput="order().req.billingPin=this.value">`}<label class="choice"><input type="checkbox" required> I accept the menu, price, service dates and terms.</label><button class="primary">Confirm sample order</button></form>`}
function finalizeOrder(){let o=order();if(!o.quotes[o.chosen].submitted)return toast('Wait for a submitted menu and quotation');o.confirmed=true;o.acceptedQuote=clone(o.quotes[o.chosen]);o.billingAddress=o.req.sameBilling?fullAddress(o.req):[o.req.billing,o.req.billingPin].filter(Boolean).join(', ');activeDates(o.req).forEach(d=>o.serviceStatus[d]=0);o.currentDate=activeDates(o.req)[0];go('tracking');toast('Sample order confirmed')}
function quote(){let o=order();if(!o)return orders();if(o.confirmed)return tracking();if(!s.quotesDraft||s.quotesDraft.orderId!==o.id){s.quotesDraft={...clone(o.quotes[0]),orderId:o.id,index:0};s.quoteDay=0}let q=s.quotesDraft;return head(o.id,'Create quotation.','The client’s service calendar and office holidays are included below.')+summary(o,true)+`<label class="field" for="quotecaterer">Prepare proposal as (demo)</label><select id="quotecaterer" onchange="selectQuote(+this.value)">${o.quotes.map((v,i)=>`<option value="${i}" ${q.index===i?'selected':''}>${esc(v.name)}</option>`).join('')}</select><div class="notice"><b>Customer budget: ${money(o.req.budget)} / plate</b><br>Build a menu within this budget, including the requested cooking and serving arrangements.</div>${q.revision?`<div class="notice"><b>Customer requested changes</b><p>${esc(q.revision)}</p></div>`:''}<form onsubmit="event.preventDefault();submitQuote()">${field('All-inclusive price per plate (₹) *','price',q.price,'quote','number','required min="1"')}<p class="muted">Include all service costs in the plate price. Illustrative tax of 5% is shown separately.</p><h3 style="margin-top:24px">Build your menu</h3><p class="sub">${q.menus.filter(m=>m.trim()).length} of ${q.menus.length} days completed. Enter dishes for every day.</p>${btn('Use sample menu as a starting point',"s.quotesDraft.menus=sampleMenu(s.quotesDraft.menus.length,order().req.diet);render()",'secondary')}<label class="field" for="menuday">${o.req.type==='Recurring meals'?o.req.cycle+'-day repeating menu':'Event menu'}</label><select id="menuday" onchange="s.quoteDay=+this.value;render()">${q.menus.map((_,i)=>`<option value="${i}" ${i===s.quoteDay?'selected':''}>Day ${i+1}</option>`).join('')}</select><label class="field" for="menu">Menu items (${o.req.diet==='Both'?'label veg and non-veg options separately':esc(o.req.diet)+' dishes'}) *</label><textarea id="menu" placeholder="Rice / bread:\nDal / curry:\nVegetable side:\nNon-veg option:\nAccompaniments:" required oninput="s.quotesDraft.menus[s.quoteDay]=this.value">${esc(q.menus[s.quoteDay])}</textarea><p class="muted">Each service day advances the menu by one day. Holidays and non-working days are skipped.</p><div class="line"><span>${pax(o.req)} pax × ${activeDates(o.req).length} service days</span><b id="quoteSubtotal">${money(totals(o,q).subtotal)}</b></div><button class="primary">Submit quotation</button></form>`}
function selectQuote(i){s.quotesDraft={...clone(order().quotes[i]),orderId:order().id,index:i};s.quoteDay=0;render()}
function submitQuote(){let q=s.quotesDraft;if(!Number.isFinite(q.price)||q.price<=0)return toast('Enter a valid price per plate');if(q.menus.some(x=>!x.trim()))return toast('Complete the menu for every cycle day');order().quotes[q.index]={name:q.name,price:q.price,menus:clone(q.menus),submitted:true};go('orders');toast('Quotation submitted to client')}
const stages=['Order confirmed','Preparing meal','Dispatched','Service completed'];function allComplete(o){return o.confirmed&&Object.values(o.serviceStatus).every(v=>v===3)}
function tracking(){let o=order();if(!o)return orders();if(!o.confirmed)return s.role==='caterer'?quote():compare();let dates=activeDates(o.req),d=o.currentDate||dates[0],stage=o.serviceStatus[d],q=o.acceptedQuote,index=dates.indexOf(d)%q.menus.length;return head(o.id,allComplete(o)?'Order completed.':'Manage your service.')+summary(o)+`<label class="field" for="serviceDate">Scheduled service</label><select id="serviceDate" onchange="order().currentDate=this.value;render()">${dates.map(x=>`<option value="${x}" ${x===d?'selected':''}>${pretty(x)} · ${stages[o.serviceStatus[x]]}</option>`).join('')}</select><div class="card"><h3>${q.name}</h3><p>Menu day ${index+1}</p><p>${esc(q.menus[index])}</p>${menuReview(q)}<div class="line"><span>Agreed order total</span><b>${money(totals(o,q).total)}</b></div></div><div class="timeline">${stages.map((x,i)=>`<p class="${i<=stage?'done':''}">${i<=stage?'✓':'○'} ${x}</p>`).join('')}</div>${s.role==='caterer'?(stage<3?btn('Mark as '+stages[stage+1].toLowerCase(),"advanceService()"): '<div class="notice">This service is complete.</div>'):(stage===3?btn('Rate this service',"go('feedback')"):'<p class="sub">Your caterer will update the service status here.</p>')}${o.req.type==='Recurring meals'?`<h3 style="margin-top:24px">Office service calendar</h3>${calendar(o.req)}${holidayList(o.req)}`:''}<div class="card"><h3>Billing address</h3><p>${esc(o.billingAddress||'Not provided')}</p></div>`}
function advanceService(){let o=order(),d=o.currentDate; if(o.serviceStatus[d]<3)o.serviceStatus[d]++;render();toast('Client service status updated')}
function feedback(){let o=order(),d=o.currentDate;if(o.serviceStatus[d]!==3)return tracking();o.feedback[d]??={ratings:{},comment:'',submitted:false};let f=o.feedback[d];return head('SERVICE FEEDBACK','How was your meal?',pretty(d)+' · '+o.acceptedQuote.name)+`${f.submitted?'<div class="notice">Feedback saved for this service.</div>':''}${['Hygiene','Service quality','Punctuality','Overall rating'].map(k=>`<label class="field">${k}</label><div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${k}: ${n} out of 5" aria-pressed="${f.ratings[k]===n}" class="${n<=f.ratings[k]?'selected':''}" onclick="order().feedback[order().currentDate].ratings['${k}']=${n};render()">${n}</button>`).join('')}</div>`).join('')}<label class="field" for="comment">Comments (optional)</label><textarea id="comment" oninput="order().feedback[order().currentDate].comment=this.value">${esc(f.comment)}</textarea>${btn(f.submitted?'Update feedback':'Submit feedback',"submitFeedback()")}`}
function submitFeedback(){let f=order().feedback[order().currentDate];if(Object.keys(f.ratings).length!==4)return toast('Please rate all four categories');f.submitted=true;render();toast('Feedback saved')}
const screens={splash,roles,contact,documents,bank,review,home,orders,profile,request,schedule,suppliers,compare,confirm:confirmOrder,quote,tracking,feedback};
const titles={contact:'Create account',documents:'Business verification',bank:'Bank verification',review:'Verification status',request:'Create order',schedule:'Service calendar',suppliers:'Select caterers',compare:'Quotations',confirm:'Review order',quote:'Create quotation',tracking:'Order details',feedback:'Rate service'};
const backs={contact:'roles',documents:'contact',bank:'documents',review:'documents',request:'home',schedule:'request',suppliers:'schedule',compare:'orders',confirm:'compare',quote:'orders',tracking:'orders',feedback:'tracking'};
function render(){let onboarding=['splash','roles','contact','documents','bank','review'].includes(s.page);$('#appbar').innerHTML=['splash','roles'].includes(s.page)?'':titles[s.page]?`<div class="appbar">${btn('‹',`go('${backs[s.page]}')`,'back')}<span class="appbar-title">${titles[s.page]}</span></div>`:`<div class="appbar"><span class="wordmark">caterworld<span>.</span></span><span class="pill">${labels[s.role]}</span></div>`;$('#screen').innerHTML=screens[s.page]();$('#bottomnav').innerHTML=onboarding?'':[['home','⌂','Home'],['orders','▤','Orders'],...(s.role==='caterer'?[]:[['request','＋','Create']]),['profile','○','Account']].map(([page,icon,label])=>`<button class="${s.page===page?'active':''}" onclick="${page==='request'?'newRequest()':`go('${page}')`}"><b>${icon}</b>${label}</button>`).join('')}
function printSketches(){let old=clone(s);s.role='business';s.profiles.business={...makeProfile(),name:'Sample Client',company:'Sample Office',status:'verified',onboarded:true};s.draft={...makeRequest(),address:'Tower A, 3rd Floor, 12 OMR Road',area:'Perungudi',pincode:'600096',fulfilment:'Cook and deliver',serving:'Yes',holidays:{'2026-10-14':'Office holiday'}};s.month='2026-10';let o={id:'CW-SAMPLE',owner:'business',req:clone(s.draft),quotes:[{name:'Sample Kitchen A',price:195,menus:sampleMenu(7),submitted:true}],chosen:0,confirmed:false,serviceStatus:{},feedback:{}};s.orders=[o];s.orderId=o.id;let pages=[['roles','Choose an account'],['contact','Business onboarding'],['documents','Mandatory GST verification'],['request','Full service address & pincode'],['schedule','Office holidays and service dates'],['compare','All-inclusive quotations'],['confirm','Optional billing address']];let html=pages.map(([page,title])=>sketch(page,title)).join('');s.role='caterer';html+=sketch('documents','GST & FSSAI verification')+sketch('bank','Bank details & proof')+sketch('home','Caterer dashboard');$('#printboard').innerHTML=html;s=old;window.print()}
function sketch(page,title){return `<article class="sketch"><div class="sketchphone"><div class="wordmark">caterworld.</div>${screens[page]()}</div><aside><p class="eyebrow">CATERWORLD · MOBILE MVP</p><h1>${title}</h1><p>Role: ${labels[s.role]}</p><p>Low-fidelity interactive prototype. Verification and transactions are simulated.</p></aside></article>`}
render();setTimeout(()=>{if(s.page==='splash')go('roles')},1600);

const renderBase=render;
let lastAnimatedPage='';
render=function(){renderBase();document.querySelectorAll('.wordmark').forEach(el=>{el.innerHTML='<img class="brand-logo" src="'+brandLogoUrl+'" alt="Caterworld">'});document.querySelectorAll('.roleicon').forEach((el,i)=>el.innerHTML=appIcon(['business','individual','caterer'][i]));document.querySelectorAll('#bottomnav button').forEach(el=>{const action=el.getAttribute('onclick')||'';const key=action.includes('newRequest')?'request':action.includes('home')?'home':action.includes('orders')?'orders':'profile';el.querySelector('b').innerHTML=appIcon(key);if(el.classList.contains('active'))el.setAttribute('aria-current','page')});if(s.page!==lastAnimatedPage&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelector('#screen').animate([{opacity:.25,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:230,easing:'cubic-bezier(.2,.7,.2,1)'});lastAnimatedPage=s.page}};
render();
</script><script>function fitPhone(){const scale=Math.min(1,(innerWidth-28)/420,(innerHeight- (innerWidth<=520?20:130))/892);document.documentElement.style.setProperty('--phone-scale',Math.max(.3,scale))}
function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('caterworld-theme',theme)}catch{}document.querySelectorAll('.theme-toggle').forEach(b=>{b.textContent=theme==='dark'?'☀ Light':'☾ Dark';b.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');b.setAttribute('aria-pressed',String(theme==='dark'))})}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
const statusRight=document.querySelector('.hardware>span:last-child');statusRight.innerHTML='<button class="theme-toggle" onclick="toggleTheme()">☾ Dark</button>';
let startingTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';try{startingTheme=localStorage.getItem('caterworld-theme')||startingTheme}catch{}setTheme(startingTheme);fitPhone();addEventListener('resize',fitPhone);
</script></body></html>
